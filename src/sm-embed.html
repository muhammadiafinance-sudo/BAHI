<script>/* SM-EMBED: inside the Mohammadia Hisab app, SM keeps its data in this app's Firebase
   (collections sm_months and sm_config) and the app's own sidebar replaces SM's. */
(function(){
  var P=null;try{P=window.parent!==window&&window.parent.__smBridge}catch(e){}
  if(!P)return;
  document.documentElement.classList.add('sm-embed');
  window.claude={use:function(n){return P.use(n)}};
  window.__smApi={
    partners:function(){try{return state.partners.slice()}catch(e){return[]}},
    totals:function(p){try{return totals(p)}catch(e){return null}},
    entries:function(){try{return state.entries}catch(e){return[]}},
    loaded:function(){try{return loaded}catch(e){return false}}
  };
  addEventListener('load',function(){
    var r=window.render;
    if(typeof r==='function')window.render=function(){var x=r.apply(this,arguments);try{P.changed()}catch(e){}return x};
    try{P.changed()}catch(e){}
  });
})();</script>
